#
name: "Pull Request Labeler"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]

jobs:
  triage:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    steps:
    - name: Label PR based on changed files
      uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b
      if: startsWith(github.event_name, 'pull_request') && github.base_ref == 'main' && github.event.action != 'closed'
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler.yml
        sync-labels: true

    - name: Manage workflow labels
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: |
          // Handle PR closed/merged: remove workflow labels.
          if (context.payload.action === 'closed') {
            const payloadLabels = new Set(context.payload.pull_request.labels.map(l => l.name));

            const toRemove = ["please-review",
                              "reviewed/needs-rework 🔨",
                              "ci-fails/needs-rework 🔥",
                              "needs-rebase",
                              "good-to-merge/waiting-for-ci 👍",
                              "good-to-merge/after-next-release",
                              "good-to-merge/with-minor-suggestions",
                              "good-to-merge/waiting-for-reporter-feedback 👍",
                              "needs-discussion 🤔",
                              "needs-reporter-feedback ❓",
                              "dont-merge 💣",
                              "squash-on-merge",
                              "quick-review 🏃‍♂️"].filter(l => payloadLabels.has(l));

            await Promise.all(toRemove.map(label =>
              github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              }).catch(e => {
                // Ignore 404 in case the label was already removed.
                if (e.status !== 404) throw e;
              })
            ));
            return;
          }

          // Non-closed PR events: manage workflow labels for non-draft PRs.
          if (context.payload.pull_request.draft)
            return;

          const payloadLabels = new Set(context.payload.pull_request.labels.map(l => l.name));

          const good_to_merge = new Set([
            "good-to-merge/waiting-for-ci 👍",
            "good-to-merge/after-next-release",
            "good-to-merge/with-minor-suggestions",
            "good-to-merge/waiting-for-reporter-feedback 👍",
          ]);

          const labelsToAdd = [];
          if (!Array.from(payloadLabels).some(l => good_to_merge.has(l))) {
            labelsToAdd.push("please-review");
          }

          // Determine workflow labels to remove (only those currently present).
          const labelsToRemove = ["reviewed/needs-rework 🔨",
                                  "ci-fails/needs-rework 🔥",
                                  "ci-failure-appears-unrelated",
                                  "needs-rebase"].filter(l => payloadLabels.has(l));

          // Execute all adds and removes in parallel.
          const ops = [];

          if (labelsToAdd.length > 0) {
            core.info(`Adding labels: ${JSON.stringify(labelsToAdd)}`);
            ops.push(github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labelsToAdd,
            }));
          }

          for (const label of labelsToRemove) {
            core.info(`Removing label: ${label}`);
            ops.push(github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
            }).catch(e => {
              // Ignore 404 in case the label was already removed.
              if (e.status !== 404) throw e;
            }));
          }

          await Promise.all(ops);
